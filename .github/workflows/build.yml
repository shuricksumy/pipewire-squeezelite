name: Build_Push_Scan

permissions:
  contents: read
  pull-requests: write
  packages: write  # Required for pushing to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '*.md'
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  # Rebuild weekly so Debian security updates reach the published image even
  # when there are no commits (paths-ignore above only applies to push events)
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag name (defaults to latest if empty)'
        required: false
        default: 'latest'

# --- Force the runner to use Node 24 for all actions ---
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The suite drives tests/fake_squeezelite.py, so it needs no PipeWire, no DAC
  # and no root -- it runs on a stock runner.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install --disable-pip-version-check flask pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/squeezelite-pipewire
          tags: |
            # Tag 'latest' only on the main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with the branch name (e.g., :main)
            type=ref,event=branch
            # Tag with the release version if applicable
            type=semver,pattern={{version}}
            # Handle manual workflow dispatch tag
            type=raw,value=${{ github.event.inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and Push Docker Image
        # Updated to v6 for Node 24 support
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # A pull request builds to prove the Dockerfile still works, but must
          # not publish -- :latest would be replaced by unreviewed code.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    # Nothing was pushed on a pull request, so there is no image to pull here.
    if: github.event_name != 'pull_request'
    # This workflow is named "Build_Push_Scan" but had no scan step -- same gap found and fixed
    # in the sibling ledfx-snapcast-docker repo. Scans the pushed GHCR image itself (base Debian
    # packages, the compiled squeezelite binary's runtime libs), not just source -- there's no
    # Python/JS/etc. source here for CodeQL to analyze (Shell isn't a supported CodeQL language),
    # so a container scan is the only applicable form of scanning for this repo.
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/squeezelite-pipewire:${{ needs.build-and-push.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Debian carries a large backlog of CVEs it has not patched; reporting
          # them buries the ones we can actually act on (a rebuild picks up the
          # fix). Only alert on vulnerabilities that have a fixed version.
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
